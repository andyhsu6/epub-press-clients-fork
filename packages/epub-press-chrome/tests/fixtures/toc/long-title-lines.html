<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>山河旧事 - 某连载</title></head>
<body><div class="readbox">
<p>第一章 雪夜投店那掌柜说后头那间房闹鬼偏我那时身上只剩七十文住不起前头一间只好提着刀上了楼<br>　　那晚雪大，山道上没有行人，灯幌子被吹得乱响。</p>
<p>第二章 破庙里遇见的少年开口便自称姓沈说话却带着明显的京腔他坐下的时候把那柄连鞘的刀横在膝上从未离手过<br>　　我问他上哪儿去，他说往上走，走到有官船的地方为止。</p>
<p>第三章 渡口的船家怎么都不肯夜渡直到把那柄刀平平放在船板上水声才重新响起来橹也摇得急了<br>　　那夜我们顺流而下，两岸漆黑，只有橹声一下一下。</p>
<p>第四章 京城底下那个小吏收钱的时候手抖得厉害像极了那年渡口的水其实他心里怕的从来不是刀是另有一桩旧事<br>　　后来我才晓得，他儿子在同一条船上。</p>
</div></body></html>
